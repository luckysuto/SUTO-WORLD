
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#10141e">
<title>SUTO-WORLD</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div>
    <h1><span id="secretS">S</span>U<span id="secretT">T</span>O-WORLD</h1>
    <small>他者を喰らい、神と成れ</small>
  </div>
</header>

<main>
  <section class="hud">
    <span id="heroInfo"></span>
    <span id="stageInfo"></span>
  </section>

  <div class="bars">
    <div class="bar"><div id="hpFill"></div></div>
    <div class="bar xp"><div id="xpFill"></div></div>
  </div>

  <div id="gameWrap">
    <canvas id="game" width="960" height="540" aria-label="ゲーム画面"></canvas>
    <div id="toast" aria-live="polite"></div>
  </div>

  <div class="soundbar">
    <button id="musicToggle">♪ BGM OFF</button>
    <label>音量
      <input id="musicVolume" type="range" min="0" max="100" value="24">
    </label>
    <span id="regionName">緑丘の森</span>
  </div>

  <div class="actions">
    <button id="attackBtn">攻撃</button>
    <button id="skillBtn">技1</button>
    <button id="skill2Btn">技2</button>
    <button id="skill3Btn">技3</button>
    <button id="skill4Btn">技4</button>
    <button id="dodgeBtn">回避</button>
    <button id="autoBtn">AUTO OFF</button>
  </div>

  <section class="party-panel">
    <h2>5人パーティ（番号キー1〜5で切替）</h2>
    <div id="partySlots"></div>
    <p>編成した仲間は自動で移動・攻撃します。仲間一覧から編成を変更できます。</p>
  </section>

  <section class="systems">
    <h2>冒険・育成・装備</h2>
    <div id="systemTabs" class="systemTabs"></div>
    <div id="systemView" class="systemView"></div>
  </section>

  <div class="panels">
    <section>
      <h2>仲間 <span id="partyCount"></span></h2>
      <div id="roster"></div>
    </section>

    <section>
      <h2>冒険の記録</h2>
      <p id="resources"></p>
      <p id="help">
        PC：WASD移動、左クリック攻撃、右クリック技4、
        Q/E/R/Fで技、Space回避、Tab/ShiftでAUTO。
        スマホ：画面左側ドラッグで移動。
      </p>
      <button id="saveBtn">セーブ</button>
      <button id="resetBtn">最初から</button>
    </section>
  </div>
</main>

<div id="adminGate" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modalContent">
    <h2>コード入力</h2>
    <input id="adminCode" placeholder="コード" autocomplete="off" maxlength="30">
    <p id="gateError" class="warning"></p>
    <button id="gateSubmit">確認</button>
    <button id="gateClose">閉じる</button>
  </div>
</div>

<div id="adminModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="adminTitle">
  <div class="modalContent">
    <div class="modalTop">
      <h2 id="adminTitle">ADMIN OVERDRIVE</h2>
      <button id="closeAdmin">閉じる</button>
    </div>

    <p class="warning">
      開発用デモです。認証機能ではありません。
      公開版ではサーバー側の権限確認が必要です。
    </p>

    <label><input type="checkbox" id="godMode"> 無敵</label>
    <label><input type="checkbox" id="oneHit"> 一撃必殺</label>
    <label><input type="checkbox" id="noCooldown"> スキル連発</label>

    <div class="adminActions">
      <button id="adminGold">ゴールド +1000</button>
      <button id="adminHeal">全回復</button>
      <button id="adminUnlock">仲間を追加</button>
      <button id="adminBoss">ボス召喚</button>
    </div>
  </div>
</div>

<script src="world-data.js"></script>
<script src="characters.js"></script>
<script src="balance.js"></script>
<script src="game.js"></script>
<script src="systems.js"></script>
<script src="audio.js"></script>
</body>
</html>
